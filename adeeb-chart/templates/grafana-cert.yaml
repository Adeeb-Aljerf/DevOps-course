apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: adeeb-grafana-tls
  namespace: adeeb
spec:
  dnsNames:
   - adeeb-grafana.infra-x.cloud
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: praxis-form-letsencrypt-prod
  secretName: adeeb-grafana-tls
  usages:
  - digital signature
  - key encipherment

 
