apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets }}
      containers:
      - name: backend
        image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}
        imagePullPolicy: Always
        env: 
          - name: MONGODB_URI 
            value: "mongodb://praxis-form-mongodb.praxis.svc.cluster.local:27017/adeeb-praxis"
          - name : JWT_EXP_MINUTES 
            value : "120"
          - name : JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: backend-secrets
                key: JWT_SECRET
          - name : ADMIN_DEFAULT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: backend-secrets
                key: ADMIN_DEFAULT_PASSWORD
        ports:
        - containerPort: 8080


