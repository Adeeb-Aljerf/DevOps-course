apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  name: adeeb-form-ingress
  namespace: adeeb

spec:
  ingressClassName: nginx
  rules:
  - host: adeeb-kubernetes.infra-x.cloud
    http:
      paths:
      - backend: 
          service:
            name: frontend-service
            port:
              number: 80
        path: /
        pathType: Prefix
      - backend: 
          service:
            name: backend-service
            port:
              number: 80
        path: /api
        pathType: Prefix
      - backend: 
          service:
            name: backend-service
            port:
              number: 80
        path: /actuator
        pathType: Prefix
  tls:
  - hosts:
    - adeeb-kubernetes.infra-x.cloud
    secretName: adeeb-form-tls